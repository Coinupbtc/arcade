<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1a17">
<title>Bubble Bay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231d1a17'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e8404f' stroke='%23120e0a' stroke-width='2'/%3E%3Ccircle cx='13' cy='13' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0b0a09;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue","Segoe UI",Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}

  #hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    display:flex;align-items:flex-start;justify-content:space-between}
  #score{font:700 26px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#5cff8a;
    letter-spacing:.04em;text-shadow:0 0 8px rgba(40,255,120,.5),0 2px 0 rgba(0,30,10,.7)}
  #round{font:700 18px/1 ui-monospace,Menlo,monospace;color:#ffb02e;letter-spacing:.08em;
    text-shadow:0 0 10px rgba(255,150,40,.45),0 2px 0 rgba(40,16,0,.8);margin-top:4px;text-align:center;flex:1}
  #best{font:600 11px/1 ui-sans-serif,Arial,sans-serif;letter-spacing:.12em;color:#c9c2b4;opacity:.8;
    margin-top:6px;text-align:right}

  .rnd{position:fixed;width:46px;height:46px;min-width:46px;min-height:46px;border-radius:50%;
    border:1px solid rgba(230,220,190,.28);background:rgba(18,16,13,.6);color:#f3ecdc;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;
    padding:0;cursor:pointer;z-index:6;transition:transform .12s,background .2s,opacity .2s}
  .rnd:active{transform:scale(.93)}
  #pause{right:calc(12px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));opacity:.8}
  #sound{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));opacity:.5}
  #sound.on{opacity:1;background:rgba(60,52,20,.7)}
  #swap{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));opacity:.85}
  .rnd svg{width:20px;height:20px;display:block}

  #overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 45%,rgba(10,8,6,.30),rgba(3,2,1,.84));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #overlay.hidden{display:none}
  #card{text-align:center;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
  #ov-kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#8fd8c0;opacity:.9}
  #ov-title{margin:0;font-weight:900;font-size:clamp(32px,9vw,58px);line-height:.98;letter-spacing:.02em;
    background:linear-gradient(180deg,#ffe6a8 0%,#ffb02e 50%,#e07a14 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(40,22,4,.9)) drop-shadow(0 0 20px rgba(255,150,40,.3))}
  #ov-sub{margin:0;font-size:14px;line-height:1.5;color:#efe6d4;opacity:.9;max-width:30ch}
  #ov-stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  #ov-stats div{display:flex;flex-direction:column;gap:2px;min-width:64px}
  #ov-stats b{font-size:24px;color:#ffd07a;line-height:1}
  #ov-stats span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#b8a98d}
  #ov-btn{margin-top:8px;min-height:56px;padding:0 34px;border-radius:999px;border:0;
    background:linear-gradient(180deg,#ffd27a,#f0a02e 55%,#d07812);color:#2a1704;
    font:900 17px/1 ui-sans-serif,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 0 #7a3f0a,0 10px 22px rgba(0,0,0,.45)}
  #ov-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #7a3f0a,0 6px 12px rgba(0,0,0,.4)}
  #ov-note{font-size:11px;letter-spacing:.12em;color:#a99b83;margin:2px 0 0}
  body.menu-mode #hud,body.menu-mode #pause,body.menu-mode #swap{opacity:0;pointer-events:none}
  #hud,#pause,#swap{transition:opacity .2s}
  @media (max-height:520px){
    #ov-title{font-size:clamp(24px,6vw,36px)}
    #ov-sub{font-size:12px}
    #ov-btn{min-height:46px;font-size:15px}
    #score{font-size:20px}#round{font-size:14px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">BEST 0</div>
  </div>
  <div id="round">ROUND 1</div>
  <div style="width:64px"></div>
</div>

<button id="pause" class="rnd" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
</button>

<button id="sound" class="rnd on" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4z" fill="currentColor" stroke="none"/>
    <path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M18 6a8 8 0 0 1 0 12"/>
  </svg>
</button>

<button id="swap" class="rnd" aria-label="Swap next bubble">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/>
  </svg>
</button>

<div id="overlay">
  <div id="card">
    <div id="ov-kicker">bubble bay</div>
    <h1 id="ov-title">BUBBLE BAY</h1>
    <p id="ov-sub">Drag to aim, release to shoot. Match three, cut the supports, and keep the wall above the line.</p>
    <div id="ov-stats"></div>
    <button id="ov-btn">Tap to start</button>
    <p id="ov-note">one thumb · portrait or landscape · best score kept</p>
  </div>
</div>

<script>if(location.pathname.indexOf("/g/")>=0){var s=document.createElement("script");s.src="/arcade/_arcade.js";s.defer=1;document.head.appendChild(s);}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
