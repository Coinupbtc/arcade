<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1507">
<title>Slice Party</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M4 26a16 16 0 0 1 32 0z' fill='%23e8384f'/%3E%3Cpath d='M2 28a18 18 0 0 1 36 0' stroke='%232f7d32' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#2a1507;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue","Segoe UI",Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}

  #hud{position:fixed;left:0;right:0;top:0;padding:
      calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
  #score-wrap{display:flex;align-items:center;gap:8px;position:relative}
  #melon{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  #score{font-size:38px;font-weight:900;letter-spacing:.02em;line-height:1;color:#ffb02e;
    text-shadow:0 2px 0 #3a1c02,0 0 14px rgba(255,150,40,.45)}
  #misses{position:absolute;left:42px;top:44px;display:flex;gap:6px}
  #misses i{width:9px;height:9px;border-radius:50%;background:#ff5a5a;
    box-shadow:0 0 6px rgba(255,70,70,.7);transition:opacity .25s,background .25s}
  #misses i.lost{background:#5a3b28;box-shadow:none;opacity:.55}
  #timer{font-size:32px;font-weight:900;line-height:1;color:#ffb02e;letter-spacing:.04em;
    text-shadow:0 2px 0 #3a1c02,0 0 14px rgba(255,150,40,.45)}
  #timer.low{color:#ff6b52;text-shadow:0 2px 0 #3a1c02,0 0 16px rgba(255,70,40,.6)}

  .rnd{position:fixed;width:46px;height:46px;min-width:46px;min-height:46px;border-radius:50%;
    border:1px solid rgba(255,232,200,.28);background:rgba(28,14,6,.55);color:#ffe8cc;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;
    padding:0;cursor:pointer;z-index:6;transition:transform .12s,background .2s,opacity .2s}
  .rnd:active{transform:scale(.93)}
  #pause{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));opacity:.7}
  #sound{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));opacity:.55}
  #sound.on{opacity:1;background:rgba(60,32,12,.75)}
  .rnd svg{width:20px;height:20px;display:block}

  #overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 42%,rgba(20,8,2,.35),rgba(8,3,1,.78));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .22s}
  #overlay.hidden{display:none}
  body.menu-mode #hud{opacity:0;transition:opacity .2s}
  body.menu-mode #pause{opacity:0;pointer-events:none}
  #hud{transition:opacity .2s}
  #card{text-align:center;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  #ov-kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#e5b98a;opacity:.85}
  #ov-title{font-size:clamp(34px,10vw,64px);font-weight:900;letter-spacing:.06em;line-height:.95;margin:0;
    background:linear-gradient(180deg,#ffe6a8 0%,#ffb02e 45%,#ef6a1c 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(58,28,2,.9)) drop-shadow(0 0 22px rgba(255,150,40,.35))}
  #ov-sub{margin:0;font-size:14px;line-height:1.5;color:#f3dcc2;opacity:.9;max-width:30ch}
  #ov-stats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  #ov-stats div{display:flex;flex-direction:column;gap:2px;min-width:64px}
  #ov-stats b{font-size:24px;color:#ffd08a;line-height:1}
  #ov-stats span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9a27a}
  #ov-btn{margin-top:8px;min-height:56px;padding:0 34px;border-radius:999px;border:0;
    background:linear-gradient(180deg,#ffd27a,#f2912a 60%,#d76f14);color:#2a1507;
    font:900 18px/1 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 0 #7d3c08,0 10px 24px rgba(0,0,0,.45)}
  #ov-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #7d3c08,0 6px 14px rgba(0,0,0,.4)}
  #ov-note{font-size:11px;letter-spacing:.12em;color:#b8946f;margin:2px 0 0}
  @media (max-height:520px){
    #ov-title{font-size:clamp(26px,7vw,40px)}
    #ov-sub{font-size:12px}
    #ov-btn{min-height:46px;font-size:16px}
    #score{font-size:30px}#timer{font-size:26px}#melon{width:28px;height:28px}
    #misses{left:34px;top:36px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score-wrap">
    <svg id="melon" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M4 26a16 16 0 0 1 32 0z" fill="#e8384f"/>
      <path d="M2.5 28a17.5 17.5 0 0 1 35 0" stroke="#2f7d32" stroke-width="4.2" fill="none"/>
      <path d="M3.5 27.4a16.5 16.5 0 0 1 33 0" stroke="#8fd18f" stroke-width="1.2" fill="none" opacity=".7"/>
      <circle cx="14" cy="23" r="1.5" fill="#1c1c1c"/>
      <circle cx="21" cy="21" r="1.5" fill="#1c1c1c"/>
      <circle cx="28" cy="23" r="1.5" fill="#1c1c1c"/>
    </svg>
    <span id="score">0</span>
    <div id="misses"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="timer">1:00</div>
</div>

<button id="pause" class="rnd" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
</button>

<button id="sound" class="rnd on" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4z" fill="currentColor" stroke="none"/>
    <path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M18 6a8 8 0 0 1 0 12"/>
  </svg>
</button>

<div id="overlay">
  <div id="card">
    <div id="ov-kicker">60 seconds</div>
    <h1 id="ov-title">SLICE PARTY</h1>
    <p id="ov-sub">Swipe through fruit. Dodge the bombs. Five drops and the run is over.</p>
    <div id="ov-stats"></div>
    <button id="ov-btn">Tap to start</button>
    <p id="ov-note">one finger · works in portrait and landscape</p>
  </div>
</div>

<script>if(location.pathname.indexOf("/g/")>=0){var s=document.createElement("script");s.src="/arcade/_arcade.js";s.defer=1;document.head.appendChild(s);}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
