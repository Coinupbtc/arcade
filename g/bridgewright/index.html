<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="Bridgewright: a free-build bridge simulator. Build any span, send the load ladder, watch what holds.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bridgewright">
<title>Bridgewright — bridge simulator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #101820;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
  }
  #safe-probe {
    position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #101820; color: #FFD166; font-weight: 800; letter-spacing: .12em; font-size: 13px;
    transition: opacity .4s ease; pointer-events: none; z-index: 5;
  }
  #boot.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Bridgewright bridge builder"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<div id="boot">BUILDING SPANS…</div>
<noscript><p style="color:#fff;padding:20px">Bridgewright needs JavaScript.</p></noscript>

<script src="vendor/matter.js"></script>
<script src="js/levels.js"></script>
<script src="js/physics.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="arcade-input.js"></script>
<script src="js/game.js"></script>
<script src="js/controls.js"></script>
<script>
  window.addEventListener('load', function () {
    var b = document.getElementById('boot');
    if (b) { b.classList.add('hide'); setTimeout(function () { b.remove(); }, 500); }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  });
</script>
<script>if(location.pathname.indexOf("/g/")>=0){var s=document.createElement("script");s.src="/arcade/_arcade.js";s.defer=1;document.head.appendChild(s);}</script>
</body>
</html>
