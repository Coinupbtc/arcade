<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#192f4e">
<title>Rocket Run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23192f4e'/%3E%3Crect x='13' y='8' width='6' height='12' fill='%232466b7'/%3E%3Crect x='14' y='20' width='4' height='4' fill='%23e8b48a'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0d1826;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  body{font-family:ui-sans-serif,-apple-system,"Helvetica Neue","Segoe UI",Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}

  #hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(60px + env(safe-area-inset-left))}
  #dist{font:700 30px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#eef6ff;
    letter-spacing:.02em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #dist span{font-size:16px;opacity:.7;margin-left:2px}
  #coins{display:flex;align-items:center;gap:6px;margin-top:6px;font:700 18px/1 ui-monospace,Menlo,monospace;color:#f2c14e;
    text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #coins i{width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff0b0,#f2c14e 55%,#b8862a);
    box-shadow:0 0 6px rgba(242,193,78,.55);display:inline-block}
  #hull{display:flex;gap:5px;margin-top:7px}
  #hull i{width:12px;height:12px;border-radius:3px;background:linear-gradient(180deg,#9fe8ff,#3aa6d8);
    box-shadow:0 0 6px rgba(90,200,255,.5)}
  #hull i.lost{background:#2a3138;box-shadow:none;opacity:.45}
  #hint{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:7;
    font:900 16px/1 ui-sans-serif,Arial,sans-serif;letter-spacing:.22em;color:#eaf6ff;opacity:0;
    transition:opacity .4s;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  #hint.on{opacity:.9}
  #best{margin-top:5px;font:600 11px/1 ui-sans-serif,Arial,sans-serif;letter-spacing:.12em;color:#b9c2c1;opacity:.75}

  .rnd{position:fixed;width:46px;height:46px;min-width:46px;min-height:46px;border-radius:12px;
    border:1px solid rgba(200,225,255,.25);background:rgba(12,24,38,.55);color:#dfe9f4;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;
    padding:0;cursor:pointer;z-index:6;transition:transform .12s,opacity .2s,background .2s}
  .rnd:active{transform:scale(.93)}
  #pause{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));opacity:.85}
  #sound{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));opacity:.5;border-radius:50%}
  #sound.on{opacity:1;background:rgba(30,60,100,.7)}
  .rnd svg{width:20px;height:20px;display:block}

  #overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 45%,rgba(8,18,32,.35),rgba(3,8,16,.82));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #overlay.hidden{display:none}
  #card{text-align:center;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  #ov-kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#8fd8b0;opacity:.9}
  #ov-title{margin:0;font-weight:900;font-size:clamp(34px,9.6vw,62px);line-height:.95;letter-spacing:.03em;
    color:#eef6ff;text-shadow:0 0 24px rgba(120,220,255,.35),0 4px 0 rgba(6,14,24,.9)}
  #ov-sub{margin:0;font-size:14px;line-height:1.5;color:#d7e4f0;opacity:.9;max-width:30ch}
  #ov-stats{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  #ov-stats div{display:flex;flex-direction:column;gap:2px;min-width:64px}
  #ov-stats b{font-size:24px;color:#f2c14e;line-height:1}
  #ov-stats span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#93a8bb}
  #ov-btn{margin-top:8px;min-height:56px;padding:0 34px;border-radius:999px;border:0;
    background:linear-gradient(180deg,#8fe3ff,#3aa6e0 55%,#1f7ab8);color:#04202e;
    font:900 18px/1 ui-sans-serif,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 6px 0 #0f4d74,0 10px 24px rgba(0,0,0,.45)}
  #ov-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0f4d74,0 6px 14px rgba(0,0,0,.4)}
  #ov-note{font-size:11px;letter-spacing:.12em;color:#8fa4b7;margin:2px 0 0}
  body.menu-mode #hud,body.menu-mode #pause{opacity:0;pointer-events:none}
  #hud,#pause{transition:opacity .2s}
  @media (max-height:520px){
    #ov-title{font-size:clamp(26px,6.4vw,38px)}
    #ov-sub{font-size:12px}
    #ov-btn{min-height:46px;font-size:16px}
    #dist{font-size:22px}#coins{font-size:15px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="dist">0<span>M</span></div>
  <div id="coins"><i></i><span id="coin-count">0</span></div>
  <div id="hull"><i></i><i></i><i></i></div>
  <div id="best">BEST 0M</div>
</div>

<div id="hint">HOLD TO CLIMB &middot; RELEASE TO SINK</div>

<button id="pause" class="rnd" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
</button>

<button id="sound" class="rnd on" aria-label="Toggle sound" aria-pressed="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M4 9.5v5h3.2l4.3 3.4V6.1L7.2 9.5H4z" fill="currentColor" stroke="none"/>
    <path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M18 6a8 8 0 0 1 0 12"/>
  </svg>
</button>

<div id="overlay">
  <div id="card">
    <div id="ov-kicker">endless lab run</div>
    <h1 id="ov-title">ROCKET RUN</h1>
    <p id="ov-sub">Hold to climb, release to sink. Three hits end the run: lasers, saws, guard bots, missiles and the floor each cost a hull.</p>
    <div id="ov-stats"></div>
    <button id="ov-btn">Tap to start</button>
    <p id="ov-note">one thumb · portrait or landscape · best distance kept</p>
  </div>
</div>

<script>if(location.pathname.indexOf("/g/")>=0){var s=document.createElement("script");s.src="/arcade/_arcade.js";s.defer=1;document.head.appendChild(s);}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
